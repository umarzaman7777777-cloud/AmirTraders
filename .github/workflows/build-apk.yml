name: Build Android APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # FIX (2026-09-05): changed from 21 to exactly 17 — the Kotlin
          # Gradle Plugin (2.0.21) added for the whisper.cpp integration
          # requires jvmToolchain(17) in both build.gradle files. Gradle
          # can auto-download a matching JDK when the one it's running
          # under doesn't match a requested toolchain version, but that
          # adds a network-dependent step during CI that can fail on its
          # own — simpler and more reliable to just give it exactly what
          # it's asking for directly.
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Make gradlew executable and build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Latest debug build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: Latest debug build
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
