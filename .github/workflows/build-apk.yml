name: Build Android APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # FIX (2026-09-05, v2): simplified back to a single JDK version.
          # The dual-JDK approach (17 + 21) didn't actually fix the
          # underlying issue — with two JDKs installed, Gradle compiled
          # Java under whichever one it runs under (21) regardless of
          # this project's compileOptions setting, while Kotlin correctly
          # respected the explicit jvmToolchain() — an inconsistency
          # WITHIN the app module, not between modules. Both
          # app/build.gradle and whisper-lib/build.gradle now target 21
          # directly (matching what capacitor-android already needs, and
          # satisfying this project's Kotlin Gradle Plugin, which just
          # needs Gradle running on 17+) — one consistent JDK, no
          # ambiguity about which task uses which.
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Make gradlew executable and build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Latest debug build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: Latest debug build
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
