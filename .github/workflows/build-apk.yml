name: Build Android APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # FIX (2026-09-05, user report: "invalid source release: 21" on
          # :capacitor-android:compileDebugJavaWithJavac): installing only
          # 17 (the previous fix) broke a DIFFERENT module — capacitor-
          # android isn't one of this project's own files at all, it's
          # generated fresh by "Sync Capacitor Android project" above from
          # the @capacitor/android npm package (see package.json), which
          # bakes in its own sourceCompatibility/targetCompatibility =
          # Java 21, entirely outside this project's control. So both
          # versions are genuinely needed at once: 21 for Capacitor's own
          # generated module, 17 for app/build.gradle and whisper-lib/
          # build.gradle's jvmToolchain(17) (required by this project's
          # Kotlin Gradle Plugin version — see those files' own comments).
          # Listing both here installs both; setup-java also sets a
          # JAVA_HOME_17_X64-style variable for each, which is exactly
          # what lets Gradle's own toolchain auto-detection find the 17
          # JDK for jvmToolchain(17) without needing to download anything,
          # while Gradle itself runs under 21 (the last one listed becomes
          # the active JAVA_HOME) — satisfying capacitor-android's plain
          # sourceCompatibility setting directly, with no toolchain
          # involved for that module at all.
          java-version: |
            17
            21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Make gradlew executable and build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Latest debug build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: Latest debug build
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
