apply plugin: 'com.android.application'
// ADD (2026-09-05, hands-on whisper.cpp integration): needed to write
// WhisperVoicePlugin.kt in Kotlin, matching whisper-lib's own language,
// rather than a more awkward Java bridge calling into Kotlin suspend
// functions. This app's other code stays exactly as-is (Java); only this
// one new plugin file uses Kotlin.
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.amirtraders.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.amirtraders.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // FIX (2026-08-31, user request): versionCode/versionName had never
        // been bumped past their initial defaults (1 / "1.0") despite this
        // app going through many real builds — Android's own package
        // installer uses versionCode (not the in-app APP_VERSION_NOTE
        // string) to decide whether an APK is actually an update.
        // versionCode is date-encoded (YYYYMMDDNN) so it keeps increasing
        // across future days automatically with zero manual bookkeeping.
        // NOTE (2026-09-01): a separate "1.0.1" plain-semantic-versioning
        // scheme was briefly applied HERE (this file) for a one-off
        // "buyer's version" resale-template zip, then reverted back to
        // this date-encoded scheme once it became clear this file doubles
        // as the seller's own ongoing working copy — the buyer's-version
        // labeling belongs only on that separate delivered zip, never on
        // this shared source. If a buyer's-version build is needed again,
        // apply that relabeling to a throwaway staging copy only, the same
        // way minification is already handled — never edit these two
        // lines directly on this file for that purpose again.
        // NOTE (2026-09-01): the debug.keystore itself changed at this build
        // (new Gmail migration, user's deliberate choice of a fresh
        // keystore) — versionCode alone won't make this install cleanly
        // over the previous 2026090116 install; that one needs a full
        // uninstall first since the signing certificate is different now.
        versionCode 2026090548
        versionName "4.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // FIX (2026-08-20): a debug build with no explicit signingConfig gets
    // signed with a NEW auto-generated debug keystore on every machine
    // that doesn't already have one — including a fresh GitHub Actions
    // runner on every single build. That would give a DIFFERENT SHA-1
    // fingerprint each time, breaking Google Sign-In (its Android OAuth
    // client is pinned to one specific SHA-1) unpredictably after every
    // rebuild. Committing a fixed debug.keystore (see debug.keystore next
    // to this file) and pointing the debug build at it explicitly keeps
    // the fingerprint identical across every CI build, matching the SHA-1
    // registered once in Google Cloud Console.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // FIX (2026-09-05, v2 - user report: "inconsistent JVM-target" error
    // persisted even after installing both JDK 17 and 21 in CI): the
    // previous fix (Java 17 here) was solving the wrong problem. With two
    // JDKs installed, Gradle was compiling Java under whichever JDK it
    // runs under (21) regardless of this compileOptions setting, while
    // Kotlin correctly used the explicit jvmToolchain(17) — an
    // inconsistency BETWEEN Java and Kotlin within this same module, not
    // between modules. The actual Kotlin Gradle Plugin requirement is
    // just "Gradle must run on JDK 17+", not "bytecode must target
    // exactly 17" — 21 satisfies that just as well. Targeting 21
    // everywhere, matching capacitor-android's own requirement exactly,
    // removes the mismatch entirely rather than fighting it — one
    // consistent JDK version, no ambiguity about which task uses which.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // ADD (2026-09-05): offline Roman-Urdu voice recognition — see
    // whisper-lib/ (built from the official ggml-org/whisper.cpp Android
    // example) and the WhisperVoicePlugin Capacitor plugin that uses it.
    implementation project(':whisper-lib')
    // ADD (2026-09-05): WhisperVoicePlugin uses coroutines (lifecycleScope)
    // to call whisper-lib's suspend functions and to run the model
    // download off the main thread without blocking the UI.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
