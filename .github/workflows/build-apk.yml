name: Build Android APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ADD (2026-09-05, whisper.cpp native voice recognition module):
      # required from this build onward. whisper-lib/build.gradle compiles
      # real C++ (whisper.cpp itself) via CMake, which needs the Android
      # NDK present — something this workflow never needed before, since
      # every previous build was pure Java/Kotlin plus the WebView content.
      # The version below must stay matched to whisper-lib/build.gradle's
      # own ndkVersion line; if that line ever changes, update this to
      # match or the build will fail with an "NDK not found" style error.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Make gradlew executable and build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Latest debug build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: Latest debug build
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
